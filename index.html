</head>

        <option value="urgente">Urgente 🔴</option>
        <option value="otra">Otra...</option>
    </select>
    <button onclick="crearTarea()">Agregar Tarea</button><br> 
    <br>

    <div id = 'contenedorCategoriaOtra'>
    </div>

    <div id = 'contenedorMensajeErrorNombre'>
    </div>

    <div id = 'contenedorMensajeErrorCategoria'>
    </div>

    <div id = 'contenedor-tareas-creadas'>
    </div>

    


    
    
    

    

    <script src="app.js"></script>
